<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ-9000 // Riced Edition</title>
    <style>
        @font-face { font-family: 'DATA'; src: url('data.ttf') format('truetype'), local('Courier New'), monospace; font-display: swap; }
        :root { 
            --chassis-dark: #111111; 
            --panel-bg: #1a1a1a; 
            --text-main: #a3a3a3; 
            --border-inset: #050505;
            --border-outset: #2d2d2d;
            
            /* Dynamic Theme Color */
            --accent-color: #00e5ff; 
            --accent-dim: rgba(0, 229, 255, 0.1);
        }
        
        body {
            font-family: 'DATA', monospace; background-color: var(--chassis-dark); color: var(--text-main);
            background-image: radial-gradient(var(--border-outset) 1px, transparent 0);
            background-size: 6px 6px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0;
            user-select: none;
        }
        
        .container { 
            width: 98vw; max-width: 1200px; 
            background-color: var(--panel-bg); 
            border: 2px solid var(--border-inset);
            border-top: 2px solid var(--border-outset);
            border-left: 2px solid var(--border-outset);
            padding: 18px; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.9);
            position: relative;
        }

        .container::before, .container::after, .container-bottom-screws::before, .container-bottom-screws::after {
            content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%; 
            background: linear-gradient(135deg, #333, #000); border: 1px solid #000;
            box-shadow: inset 0 0 2px #666;
        }
        .container::before { top: 8px; left: 8px; } .container::after { top: 8px; right: 8px; }
        .container-bottom-screws::before { bottom: 8px; left: 8px; } .container-bottom-screws::after { bottom: 8px; right: 8px; }

        .menu-bar {
            display: flex; gap: 20px; background: #141414; padding: 8px 15px; 
            border: 1px solid #000; border-bottom: 1px solid #222;
            font-size: 13px; margin-bottom: 12px; align-items: center; position: relative;
        }
        .menu-item { cursor: pointer; position: relative; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; }
        .menu-item:hover { color: var(--accent-color); }
        
        .dropdown {
            display: none; position: absolute; top: 100%; left: 0; background: #141414;
            border: 1px solid var(--accent-color); min-width: 200px; z-index: 100;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.9);
        }
        .menu-item.active .dropdown { display: block; }
        .dropdown-item {
            padding: 12px 15px; font-size: 12px; color: var(--text-main); cursor: pointer; text-transform: uppercase;
            border-bottom: 1px solid #0a0a0a;
        }
        .dropdown-item:hover { background: #1c1c1c; color: var(--accent-color); }
        .dropdown-item:disabled { opacity: 0.3; cursor: not-allowed; color: #555; }

        .toolbar {
            display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center;
            background: #141414; padding: 12px; border: 1px solid #000; box-shadow: inset 0 0 10px #000;
        }
        
        .time-display {
            font-family: 'DATA', monospace; background: #050505; border: 2px solid #000;
            color: var(--accent-color); padding: 8px 15px; font-size: 20px; letter-spacing: 3px;
            box-shadow: inset 0 0 10px var(--accent-dim); text-shadow: 0 0 5px var(--accent-color);
        }

        .transport-recess {
            display: flex; gap: 8px;
            background: #080808; 
            padding: 8px;
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-bottom: 1px solid #2a2a2a;
            border-right: 1px solid #2a2a2a;
            box-shadow: inset 4px 4px 15px rgba(0,0,0,0.9), inset -1px -1px 3px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .rubber-btn {
            font-family: 'DATA', monospace; 
            background: #1f1f1f; 
            color: var(--text-main);
            width: 44px; height: 44px;
            border: 1px solid #000; 
            border-top: 1px solid #3c3c3c;
            border-left: 1px solid #2a2a2a;
            border-radius: 4px; 
            font-size: 18px; 
            cursor: pointer;
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.7), inset 0 0 4px rgba(0,0,0,0.4);
            transition: all 0.05s;
        }
        
        .rubber-btn:hover:not(:disabled) { 
            color: var(--accent-color); 
            text-shadow: 0 0 8px var(--accent-dim);
            background: #242424;
        }
        .rubber-btn:active:not(:disabled) { 
            border-top: 1px solid #000; 
            border-left: 1px solid #000;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.9);
            color: var(--accent-color); 
            background-color: #151515;
            transform: translateY(2px);
        }
        .rubber-btn:disabled { 
            opacity: 0.2; cursor: not-allowed; border-top: 1px solid #111; box-shadow: none; 
        }

        .chop-controls {
            display: none; align-items: center; gap: 15px; background: #080808; 
            border: 1px solid #000; padding: 0 15px; font-size: 12px; height: 44px;
            box-shadow: inset 0 0 5px #000;
        }
        .chop-controls.active { display: flex; }
        
        input[type="checkbox"] { 
            accent-color: var(--accent-color); transform: scale(1.2); cursor: pointer; 
            background: #000; border: 1px solid var(--accent-color);
        }

        .info-panel { 
            background: #080808; padding: 10px 15px; 
            border: 2px solid #000; box-shadow: inset 0 0 8px #000;
            margin-bottom: 12px; font-size: 12px; 
            display: flex; justify-content: space-between; color: #777;
        }
        .info-panel span { color: var(--accent-color); text-shadow: 0 0 3px var(--accent-dim); }

        #waveformCanvas { 
            width: 100%; height: 380px; 
            background-color: #050505; 
            border: 2px solid #000; border-bottom: 1px solid #222; border-right: 1px solid #222;
            cursor: crosshair; touch-action: none; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }
        
        #loadSampleInput { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="container-bottom-screws"></div>
    
    <div class="menu-bar">
        <div class="menu-item" onclick="toggleMenu(event, 'fileMenu')">File
            <div id="fileMenu" class="dropdown">
                <div class="dropdown-item" onclick="closeMenus(); document.getElementById('loadSampleInput').click()">Open Audio...</div>
                <div class="dropdown-item" id="menuExport" onclick="closeMenus(); exportWav()" disabled>Export Selection</div>
                <div class="dropdown-item" id="menuExportSlices" onclick="closeMenus(); exportSlices()" disabled>Export Slices (ZIP)</div>
            </div>
        </div>
        <div class="menu-item" onclick="toggleMenu(event, 'editMenu')">Edit
            <div id="editMenu" class="dropdown">
                <div class="dropdown-item" id="menuUndo" onclick="closeMenus(); undo()" disabled>Undo</div>
                <div class="dropdown-item" id="menuCut" onclick="closeMenus(); cutSelection()" disabled>Cut</div>
                <div class="dropdown-item" id="menuCopy" onclick="closeMenus(); copySelection()" disabled>Copy</div>
                <div class="dropdown-item" id="menuPaste" onclick="closeMenus(); pasteSelection()" disabled>Paste</div>
                <div class="dropdown-item" id="menuFadeIn" onclick="closeMenus(); fadeInSelection()" disabled>Fade In</div>
                <div class="dropdown-item" id="menuFadeOut" onclick="closeMenus(); fadeOutSelection()" disabled>Fade Out</div>
            </div>
        </div>
        <div class="menu-item" onclick="toggleMenu(event, 'selectMenu')">Select
            <div id="selectMenu" class="dropdown">
                <div class="dropdown-item" id="menuSelectionMode" onclick="closeMenus(); toggleSelectionMode()">Drag Mode: Playhead</div>
                <div class="dropdown-item" id="menuZeroCross" onclick="closeMenus(); toggleZeroCross()">Zero Cross: ON</div>
                <div class="dropdown-item" style="display:flex; justify-content:space-between; align-items:center;" onclick="event.stopPropagation();">
                    Theme Color 
                    <input type="color" id="themeColorPicker" value="#00e5ff" style="background:none; border:none; width:26px; height:26px; cursor:pointer; padding:0;">
                </div>
            </div>
        </div>
        <div class="menu-item" onclick="toggleMenu(event, 'viewMenu')">View
            <div id="viewMenu" class="dropdown">
                <div class="dropdown-item" onclick="closeMenus(); zoomIn()">Zoom In (+)</div>
                <div class="dropdown-item" onclick="closeMenus(); zoomOut()">Zoom Out (-)</div>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <div class="time-display" id="timeDisplay">00:00:000</div>
        
        <div class="transport-recess">
            <button id="btnPlay" class="rubber-btn" title="Play" disabled>►</button>
            <button id="btnStop" class="rubber-btn" title="Stop" disabled>■</button>
            <button id="btnLoop" class="rubber-btn" title="Loop" disabled>⟳</button>
            <button id="btnChopMode" class="rubber-btn" title="Chop Mode" disabled>✂</button>
        </div>
        
        <div class="chop-controls" id="chopControlsPanel">
            <label style="display:flex; align-items:center; cursor:pointer; color: var(--text-main);">
                <input type="checkbox" id="triggerModeCheck" style="margin-right:8px;"> TRIGGER
            </label>
            <label style="display:flex; align-items:center; cursor:pointer; color: var(--text-main);">
                <input type="checkbox" id="deleteChopCheck" style="margin-right:8px;"> DEL CHOP
            </label>
        </div>

        <input type="file" id="loadSampleInput" accept="audio/*">
    </div>

    <div class="info-panel">
        <div>STATUS: <span id="status">AWAITING AUDIO</span></div>
        <div>WINDOW: <span id="loopRangeDisplay">0.000S &gt;&gt; 0.000S</span></div>
        <div>ZOOM: <span id="zoomMag">1X</span> | AMP: <span id="ampMag">1.0X</span></div>
    </div>
    
    <canvas id="waveformCanvas"></canvas>
</div>

<script>
    let audioCtx, audioBuf, sourceNode = null;
    let loopStart = 0, loopEnd = 0, currentPlayTime = 0;
    let isPlaying = false, isDragging = false, dragTarget = null;
    let zoomH = 1, scrollPos = 0, ampZoom = 1;
    let playbackStartTime = 0, aniFrame = null;
    let isLoopingActive = true;
    let wasPlayingBeforeDrag = false;
    
    let isZeroCross = true;
    let isChopMode = false;
    let isTriggerMode = false;
    let isDeleteChopMode = false;
    let sliceMarkers = []; 
    let draggedSliceIndex = null;
    let activeSliceStart = 0;

    let isQuickSelectMode = false;
    let selectOriginTime = 0;

    let currentThemeColor = "#00e5ff"; 
    let clipboardData = null;
    let undoStack = [];
    const MAX_UNDO = 10;

    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const loopDisp = document.getElementById('loopRangeDisplay');
    const zoomMagDisp = document.getElementById('zoomMag');
    const ampMagDisp = document.getElementById('ampMag');
    const timeDisplay = document.getElementById('timeDisplay');
    const input = document.getElementById('loadSampleInput');
    
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const btnLoop = document.getElementById('btnLoop');
    const btnChopMode = document.getElementById('btnChopMode');
    const chopControlsPanel = document.getElementById('chopControlsPanel');
    const triggerModeCheck = document.getElementById('triggerModeCheck');
    const deleteChopCheck = document.getElementById('deleteChopCheck');
    const themeColorPicker = document.getElementById('themeColorPicker');

    const menuUndo = document.getElementById('menuUndo');
    const menuCut = document.getElementById('menuCut');
    const menuCopy = document.getElementById('menuCopy');
    const menuPaste = document.getElementById('menuPaste');
    const menuFadeIn = document.getElementById('menuFadeIn');
    const menuFadeOut = document.getElementById('menuFadeOut');
    const menuExport = document.getElementById('menuExport');
    const menuExportSlices = document.getElementById('menuExportSlices');
    const menuZeroCross = document.getElementById('menuZeroCross');
    const menuSelectionMode = document.getElementById('menuSelectionMode');

    function hexToRgba(hex, alpha) {
        let r = parseInt(hex.slice(1, 3), 16),
            g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    themeColorPicker.addEventListener('input', (e) => {
        currentThemeColor = e.target.value;
        document.documentElement.style.setProperty('--accent-color', currentThemeColor);
        document.documentElement.style.setProperty('--accent-dim', hexToRgba(currentThemeColor, 0.15));
        
        if (isPlaying) btnPlay.style.color = currentThemeColor;
        if (isLoopingActive) btnLoop.style.color = currentThemeColor;
        if (isChopMode) btnChopMode.style.color = currentThemeColor;
        if (isQuickSelectMode) menuSelectionMode.style.color = currentThemeColor;
        
        draw(currentPlayTime);
    });

    function closeMenus() {
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
    }

    function toggleMenu(e, menuId) {
        if (e.target.classList.contains('dropdown-item')) return;
        e.stopPropagation();
        document.querySelectorAll('.dropdown').forEach(d => {
            if (d.id !== menuId) d.parentElement.classList.remove('active');
        });
        e.currentTarget.classList.toggle('active');
    }
    
    window.onclick = closeMenus;

    function toggleZeroCross() {
        isZeroCross = !isZeroCross;
        menuZeroCross.innerText = `Zero Cross: ${isZeroCross ? 'ON' : 'OFF'}`;
        menuZeroCross.style.color = isZeroCross ? 'var(--accent-color)' : 'var(--text-main)';
    }

    function toggleSelectionMode() {
        isQuickSelectMode = !isQuickSelectMode;
        menuSelectionMode.innerText = `Drag Mode: ${isQuickSelectMode ? 'Region' : 'Playhead'}`;
        menuSelectionMode.style.color = isQuickSelectMode ? 'var(--accent-color)' : 'var(--text-main)';
    }

    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function findZeroCrossing(time) {
        if (!audioBuf || !isZeroCross) return time;
        const data = audioBuf.getChannelData(0);
        const centerIdx = Math.floor(time * audioBuf.sampleRate);
        const range = 500;
        let bestIdx = centerIdx, minAmp = 1.0;
        for (let i = centerIdx - range; i < centerIdx + range; i++) {
            if (i >= 0 && i < data.length) {
                const absVal = Math.abs(data[i]);
                if (absVal < minAmp) { minAmp = absVal; bestIdx = i; }
            }
        }
        return bestIdx / audioBuf.sampleRate;
    }

    function startAudio(offset = 0) {
        if (!audioBuf) return;
        getAudioContext();
        if (sourceNode) { sourceNode.stop(); sourceNode.disconnect(); }
        
        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuf;

        if (isChopMode && isTriggerMode) {
            let sorted = [0, ...sliceMarkers.sort((a,b)=>a-b), audioBuf.duration];
            let sStart = 0, sEnd = audioBuf.duration;
            
            for (let i = 0; i < sorted.length - 1; i++) {
                if (offset >= sorted[i] - 0.0001 && offset < sorted[i+1]) {
                    sStart = sorted[i]; sEnd = sorted[i+1]; break;
                }
            }

            activeSliceStart = sStart;
            sourceNode.loop = false;
            sourceNode.connect(audioCtx.destination);
            
            let durationToPlay = sEnd - sStart;
            if (durationToPlay <= 0) return;

            sourceNode.start(0, sStart, durationToPlay);
            playbackStartTime = audioCtx.currentTime - sStart;
            currentPlayTime = sStart;
            isPlaying = true;
            sourceNode.onended = () => { if (isPlaying) stopAudio(); };
        } else {
            sourceNode.loop = isLoopingActive;
            sourceNode.loopStart = loopStart;
            sourceNode.loopEnd = loopEnd;
            sourceNode.connect(audioCtx.destination);
            
            let startPoint = offset;
            if (isLoopingActive && (startPoint < loopStart || startPoint > loopEnd)) {
                startPoint = loopStart;
            }
            
            sourceNode.start(0, startPoint);
            playbackStartTime = audioCtx.currentTime - startPoint;
            currentPlayTime = startPoint;
            isPlaying = true;

            if (!isLoopingActive) {
                sourceNode.onended = () => { if (isPlaying) stopAudio(); };
            }
        }
        
        btnPlay.style.color = "var(--accent-color)";
        renderLoop();
    }

    function stopAudio() {
        if (sourceNode) { sourceNode.stop(); sourceNode = null; }
        isPlaying = false;
        btnPlay.style.color = "";
        cancelAnimationFrame(aniFrame);
        draw(currentPlayTime);
    }

    btnPlay.onclick = () => { if (isPlaying) stopAudio(); else startAudio(currentPlayTime); };
    btnStop.onclick = () => { stopAudio(); currentPlayTime = 0; draw(0); updateTimeDisplay(0); };
    
    btnLoop.onclick = () => {
        isLoopingActive = !isLoopingActive;
        btnLoop.style.color = isLoopingActive ? "var(--accent-color)" : "";
        if (sourceNode && !isChopMode) { 
            if (isPlaying) {
                let t = currentPlayTime;
                stopAudio();
                startAudio(t);
            }
        }
    };
    btnLoop.style.color = "var(--accent-color)";

    btnChopMode.onclick = () => {
        isChopMode = !isChopMode;
        btnChopMode.style.color = isChopMode ? "var(--accent-color)" : "";
        chopControlsPanel.classList.toggle('active', isChopMode);
        if (isChopMode && sliceMarkers.length === 0 && audioBuf) {
            sliceMarkers = [loopStart, loopEnd];
        }
        draw(currentPlayTime);
    };

    triggerModeCheck.onchange = (e) => isTriggerMode = e.target.checked;
    deleteChopCheck.onchange = (e) => isDeleteChopMode = e.target.checked;

    function updateTimeDisplay(timeSec) {
        const mins = Math.floor(timeSec / 60).toString().padStart(2, '0');
        const secs = Math.floor(timeSec % 60).toString().padStart(2, '0');
        const millis = Math.floor((timeSec % 1) * 1000).toString().padStart(3, '0');
        timeDisplay.textContent = `${mins}:${secs}:${millis}`;
    }

    function syncLoopPoints() {
        if (sourceNode && isPlaying && !isChopMode) {
            sourceNode.loopStart = loopStart;
            sourceNode.loopEnd = loopEnd;
        }
    }

    function getVisibleData() {
        if (!audioBuf) return { startSmp: 0, visibleSamples: 0 };
        const visibleSamples = audioBuf.length / zoomH;
        const scrollable = audioBuf.length - visibleSamples;
        const startSmp = scrollPos * scrollable;
        return { startSmp, visibleSamples };
    }

    function xToTime(x) {
        const { startSmp, visibleSamples } = getVisibleData();
        return ((x / canvas.width) * visibleSamples + startSmp) / audioBuf.sampleRate;
    }

    function timeToX(t) {
        const { startSmp, visibleSamples } = getVisibleData();
        return (((t * audioBuf.sampleRate) - startSmp) / visibleSamples) * canvas.width;
    }

    canvas.onwheel = (e) => {
        if (!audioBuf) return;
        e.preventDefault();
        if (e.shiftKey) {
            const step = (e.deltaY * 0.0005) / zoomH * 10;
            scrollPos = Math.max(0, Math.min(1, scrollPos + step));
        } else {
            const focalTime = xToTime(e.offsetX);
            const zoomFactor = e.deltaY > 0 ? 0.85 : 1.15;
            zoomH = Math.max(1, Math.min(50000, zoomH * zoomFactor));
            const newVisible = audioBuf.length / zoomH;
            const newStartSmp = (focalTime * audioBuf.sampleRate) - (e.offsetX / canvas.width) * newVisible;
            const maxScroll = audioBuf.length - newVisible;
            scrollPos = maxScroll <= 0 ? 0 : Math.max(0, Math.min(1, newStartSmp / maxScroll));
        }
        draw(currentPlayTime); updateUI();
    };

    canvas.onmousedown = (e) => {
        if (!audioBuf) return;
        let time = xToTime(e.offsetX);
        const tol = (15 / canvas.width) * (audioBuf.length / zoomH / audioBuf.sampleRate);

        if (isChopMode) {
            let clickedMarkerIdx = -1;
            for (let i = 0; i < sliceMarkers.length; i++) {
                if (Math.abs(time - sliceMarkers[i]) < tol) {
                    clickedMarkerIdx = i; break;
                }
            }

            if (isDeleteChopMode) {
                if (clickedMarkerIdx !== -1) {
                    sliceMarkers.splice(clickedMarkerIdx, 1);
                    draw(currentPlayTime);
                }
                return; 
            }

            if (clickedMarkerIdx !== -1) {
                draggedSliceIndex = clickedMarkerIdx;
                dragTarget = 'sliceMarker';
                isDragging = true;
            } else if (isTriggerMode) {
                let sorted = [0, ...sliceMarkers.sort((a,b)=>a-b), audioBuf.duration];
                let sStart = 0;
                for (let i = 0; i < sorted.length - 1; i++) {
                    if (time >= sorted[i] && time < sorted[i+1]) {
                        sStart = sorted[i]; break;
                    }
                }
                currentPlayTime = Math.max(0, Math.min(audioBuf.duration, sStart));
                if (isPlaying) stopAudio();
                startAudio(currentPlayTime);
                isDragging = false;
            } else {
                time = findZeroCrossing(time);
                sliceMarkers.push(Math.max(0, Math.min(audioBuf.duration, time)));
                sliceMarkers.sort((a, b) => a - b);
                
                draggedSliceIndex = sliceMarkers.indexOf(time);
                dragTarget = 'sliceMarker';
                isDragging = true;
                draw(currentPlayTime);
            }
            return;
        }

        time = findZeroCrossing(time);

        if (isQuickSelectMode) {
            selectOriginTime = time;
            loopStart = time;
            loopEnd = time + 0.001; 
            dragTarget = 'quickSelect';
            isDragging = true;
            
            wasPlayingBeforeDrag = isPlaying;
            if (isPlaying) stopAudio();
            
            currentPlayTime = time;
            updateTimeDisplay(currentPlayTime);
            draw(currentPlayTime); 
            return;
        }

        if (Math.abs(time - loopStart) < tol) { dragTarget = 'start'; }
        else if (Math.abs(time - loopEnd) < tol) { dragTarget = 'end'; }
        else {
            currentPlayTime = Math.max(0, Math.min(audioBuf.duration, time));
            
            wasPlayingBeforeDrag = isPlaying;
            if (isPlaying) stopAudio();
            
            updateTimeDisplay(currentPlayTime);
            draw(currentPlayTime); 
            dragTarget = 'seek';
        }
        isDragging = true;
    };

    window.onmousemove = (e) => {
        if (!isDragging || !audioBuf) return;
        const rect = canvas.getBoundingClientRect();
        const rawX = e.clientX - rect.left;
        let time = Math.max(0, Math.min(audioBuf.duration, xToTime(rawX)));
        
        if (isChopMode && dragTarget === 'sliceMarker' && draggedSliceIndex !== null) {
            time = findZeroCrossing(time);
            sliceMarkers[draggedSliceIndex] = time;
            sliceMarkers.sort((a, b) => a - b);
            draggedSliceIndex = sliceMarkers.indexOf(time);
        } else if (dragTarget === 'quickSelect') {
            time = findZeroCrossing(time);
            loopStart = Math.min(selectOriginTime, time);
            loopEnd = Math.max(selectOriginTime, time);
            if (loopEnd - loopStart < 0.001) loopEnd = loopStart + 0.001; 
        } else {
            if (dragTarget === 'start') { 
                time = findZeroCrossing(time);
                loopStart = Math.min(time, loopEnd - 0.001); 
            } else if (dragTarget === 'end') { 
                time = findZeroCrossing(time);
                loopEnd = Math.max(time, loopStart + 0.001); 
            } else if (dragTarget === 'seek') {
                currentPlayTime = time;
                updateTimeDisplay(time);
            }
        }
        
        syncLoopPoints(); 
        draw(currentPlayTime); 
        updateUI();
    };

    window.onmouseup = () => { 
        if (isDragging && (dragTarget === 'seek' || dragTarget === 'quickSelect') && wasPlayingBeforeDrag) {
            startAudio(currentPlayTime);
        }
        wasPlayingBeforeDrag = false;
        isDragging = false; dragTarget = null; draggedSliceIndex = null; draw(currentPlayTime); 
    };

    function cloneAudioBuffer(buf) {
        if (!buf) return null;
        const clone = audioCtx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
        for(let c=0; c<buf.numberOfChannels; c++) {
            clone.getChannelData(c).set(buf.getChannelData(c));
        }
        return clone;
    }

    function saveState() {
        if (!audioBuf) return;
        undoStack.push({
            buf: cloneAudioBuffer(audioBuf),
            zoom: zoomH,
            scroll: scrollPos,
            lStart: loopStart,
            lEnd: loopEnd
        });
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        menuUndo.disabled = false;
    }

    function undo() {
        if (undoStack.length === 0) return;
        const wasPlaying = isPlaying;
        if (wasPlaying) stopAudio();
        
        const state = undoStack.pop();
        audioBuf = state.buf;
        zoomH = state.zoom;
        scrollPos = state.scroll;
        loopStart = state.lStart;
        loopEnd = state.lEnd;
        
        if (undoStack.length === 0) menuUndo.disabled = true;
        
        currentPlayTime = Math.min(currentPlayTime, audioBuf.duration);
        
        updateUI(); draw(currentPlayTime);
        status.textContent = "STATE REVERTED";
        if (wasPlaying) startAudio(currentPlayTime);
    }

    function copySelection() {
        if (!audioBuf) return;
        const sSmp = Math.floor(loopStart * audioBuf.sampleRate);
        const eSmp = Math.floor(loopEnd * audioBuf.sampleRate);
        const len = eSmp - sSmp;
        if (len <= 0) return;
        
        getAudioContext();
        clipboardData = audioCtx.createBuffer(audioBuf.numberOfChannels, len, audioBuf.sampleRate);
        for(let c=0; c<audioBuf.numberOfChannels; c++) {
            clipboardData.getChannelData(c).set(audioBuf.getChannelData(c).subarray(sSmp, eSmp));
        }
        menuPaste.disabled = false;
        status.textContent = "COPIED TO CLIPBOARD";
    }

    function cutSelection() {
        if (!audioBuf) return;
        copySelection();
        saveState();

        const oldDur = audioBuf.duration;
        const sSmp = Math.floor(loopStart * audioBuf.sampleRate);
        const eSmp = Math.floor(loopEnd * audioBuf.sampleRate);
        const len = audioBuf.length - (eSmp - sSmp);
        
        if (len <= 0) { status.textContent = "ERR: CANNOT CUT ENTIRE FILE"; return; }

        const newBuf = audioCtx.createBuffer(audioBuf.numberOfChannels, len, audioBuf.sampleRate);
        for(let c=0; c<audioBuf.numberOfChannels; c++) {
            const oldData = audioBuf.getChannelData(c);
            const newData = newBuf.getChannelData(c);
            newData.set(oldData.subarray(0, sSmp), 0);
            newData.set(oldData.subarray(eSmp), sSmp);
        }
        
        const wasPlaying = isPlaying;
        if (wasPlaying) stopAudio();
        
        audioBuf = newBuf;
        
        zoomH = Math.max(1, zoomH * (audioBuf.duration / oldDur));
        
        loopEnd = Math.min(loopStart + 0.05, audioBuf.duration);
        currentPlayTime = Math.min(currentPlayTime, audioBuf.duration);
        
        updateUI(); draw(currentPlayTime);
        status.textContent = "CUT SELECTION";
        if (wasPlaying) startAudio(loopStart);
    }

    function pasteSelection() {
        if (!audioBuf || !clipboardData) return;
        saveState();
        
        const oldDur = audioBuf.duration;
        const insertSmp = Math.floor(currentPlayTime * audioBuf.sampleRate);
        const newLen = audioBuf.length + clipboardData.length;
        const newBuf = audioCtx.createBuffer(audioBuf.numberOfChannels, newLen, audioBuf.sampleRate);
        
        for(let c=0; c<audioBuf.numberOfChannels; c++) {
            const oldData = audioBuf.getChannelData(c);
            const clipData = clipboardData.getChannelData(c);
            const newData = newBuf.getChannelData(c);
            
            newData.set(oldData.subarray(0, insertSmp), 0);
            newData.set(clipData, insertSmp);
            newData.set(oldData.subarray(insertSmp), insertSmp + clipData.length);
        }
        
        const wasPlaying = isPlaying;
        if (wasPlaying) stopAudio();
        
        audioBuf = newBuf;

        zoomH = Math.max(1, zoomH * (audioBuf.duration / oldDur));
        
        loopStart = currentPlayTime;
        loopEnd = currentPlayTime + clipboardData.duration;
        
        updateUI(); draw(currentPlayTime);
        status.textContent = "PASTED AT PLAYHEAD";
        if (wasPlaying) startAudio(loopStart);
    }

    function fadeInSelection() {
        if (!audioBuf) return;
        saveState();

        const sSmp = Math.floor(loopStart * audioBuf.sampleRate);
        const eSmp = Math.floor(loopEnd * audioBuf.sampleRate);
        const len = eSmp - sSmp;
        if (len <= 0) return;

        for (let c = 0; c < audioBuf.numberOfChannels; c++) {
            const data = audioBuf.getChannelData(c);
            for (let i = 0; i < len; i++) {
                data[sSmp + i] *= (i / len); 
            }
        }
        
        draw(currentPlayTime);
        status.textContent = "FADE IN APPLIED";
    }

    function fadeOutSelection() {
        if (!audioBuf) return;
        saveState();

        const sSmp = Math.floor(loopStart * audioBuf.sampleRate);
        const eSmp = Math.floor(loopEnd * audioBuf.sampleRate);
        const len = eSmp - sSmp;
        if (len <= 0) return;

        for (let c = 0; c < audioBuf.numberOfChannels; c++) {
            const data = audioBuf.getChannelData(c);
            for (let i = 0; i < len; i++) {
                data[sSmp + i] *= (1.0 - (i / len)); 
            }
        }
        
        draw(currentPlayTime);
        status.textContent = "FADE OUT APPLIED";
    }

    function zoomIn() { zoomH = Math.min(50000, zoomH * 1.5); draw(currentPlayTime); updateUI(); }
    function zoomOut() { zoomH = Math.max(1, zoomH / 1.5); draw(currentPlayTime); updateUI(); }

    function draw(now = null) {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#050505'; ctx.fillRect(0,0,w,h);

        const gutterHeight = 18;
        ctx.fillStyle = '#080808';
        ctx.fillRect(0, 0, w, gutterHeight);
        ctx.fillStyle = '#222';
        ctx.fillRect(0, gutterHeight, w, 1);

        if (!audioBuf) return;
        
        const data = audioBuf.getChannelData(0);
        const { startSmp, visibleSamples } = getVisibleData();
        const step = Math.max(1, visibleSamples / w);
        const channelHeight = h - gutterHeight;
        const yOffset = gutterHeight;
        
        ctx.beginPath(); 
        ctx.strokeStyle = currentThemeColor; 
        ctx.lineWidth = 1;

        for (let i = 0; i < w; i++) {
            const b = Math.floor(startSmp + (i * step));
            if (b >= data.length) break;
            let min = 1.0, max = -1.0;
            for(let j=0; j<step; j++) {
                const v = data[b+j] || 0; if(v<min) min=v; if(v>max) max=v;
            }
            const yMin = yOffset + (1 + min * ampZoom) * channelHeight / 2;
            const yMax = yOffset + (1 + max * ampZoom) * channelHeight / 2;
            ctx.moveTo(i, yMin); ctx.lineTo(i, yMax);
        }
        ctx.stroke();

        if (isChopMode) {
            for (let i = 0; i < sliceMarkers.length; i++) {
                let mX = timeToX(sliceMarkers[i]);
                ctx.strokeStyle = currentThemeColor;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(mX, gutterHeight); ctx.lineTo(mX, h); ctx.stroke();

                ctx.fillStyle = currentThemeColor;
                ctx.fillRect(mX - 6, gutterHeight, 12, 14);
                ctx.fillStyle = '#000';
                ctx.font = '9px DATA';
                ctx.fillText(`${i+1}`, mX - 3, gutterHeight + 11);
            }
        } else {
            const sX = timeToX(loopStart), eX = timeToX(loopEnd);
            
            ctx.fillStyle = hexToRgba(currentThemeColor, 0.15); 
            ctx.fillRect(sX, gutterHeight, eX - sX, h - gutterHeight);

            ctx.strokeStyle = currentThemeColor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sX, gutterHeight); ctx.lineTo(sX, h); ctx.stroke();
            ctx.fillStyle = currentThemeColor; ctx.fillRect(sX-6, gutterHeight, 12, 14);
            ctx.fillStyle = '#000'; ctx.font = '10px DATA'; ctx.fillText('S', sX-3, gutterHeight + 11);
            
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(eX, gutterHeight); ctx.lineTo(eX, h); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.fillRect(eX-6, h-14, 12, 14);
            ctx.fillStyle = '#000'; ctx.font = '10px DATA'; ctx.fillText('E', eX-3, h-3);
        }
        
        if (now !== null) {
            const pX = timeToX(now);
            if (pX >= -10 && pX <= w + 10) {
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(pX - 6, 0);
                ctx.lineTo(pX + 6, 0);
                ctx.lineTo(pX, gutterHeight - 2);
                ctx.fill();

                ctx.strokeStyle = '#ff0055'; 
                ctx.lineWidth = 1.5; 
                ctx.beginPath();
                ctx.moveTo(pX, gutterHeight); ctx.lineTo(pX, h); ctx.stroke();
            }
        }
    }

    function renderLoop() {
        if (!isPlaying) return;
        
        if (isChopMode && isTriggerMode) {
            let absoluteTime = audioCtx.currentTime - playbackStartTime;
            currentPlayTime = absoluteTime;
            draw(currentPlayTime);
            updateTimeDisplay(currentPlayTime);
            aniFrame = requestAnimationFrame(renderLoop);
            return;
        }

        const dur = loopEnd - loopStart;
        if (dur <= 0) return;
        
        let absoluteTime = audioCtx.currentTime - playbackStartTime;
        
        if (isLoopingActive) {
            let offset = absoluteTime - loopStart;
            if (offset < 0) offset = 0;
            currentPlayTime = loopStart + (offset % dur);
        } else {
            currentPlayTime = absoluteTime;
            if (currentPlayTime >= audioBuf.duration) {
                currentPlayTime = audioBuf.duration;
            }
        }

        draw(currentPlayTime);
        updateTimeDisplay(currentPlayTime);
        aniFrame = requestAnimationFrame(renderLoop);
    }

    function updateUI() {
        if (!audioBuf) return;
        loopDisp.textContent = `${loopStart.toFixed(3)}S >> ${loopEnd.toFixed(3)}S`;
        zoomMagDisp.textContent = `${Math.round(zoomH)}X`;
        ampMagDisp.textContent = `${ampZoom.toFixed(1)}X`;
    }

    async function handleFile(e) {
        const file = e.target.files[0]; if (!file) return;
        getAudioContext(); status.textContent = 'SCANNING...';
        try {
            const ab = await file.arrayBuffer();
            audioBuf = await audioCtx.decodeAudioData(ab);
            loopStart = 0; loopEnd = audioBuf.duration;
            zoomH = 1; scrollPos = 0; currentPlayTime = 0;
            undoStack = []; sliceMarkers = [];
            
            menuUndo.disabled = true;
            menuCut.disabled = false; menuCopy.disabled = false;
            menuExport.disabled = false; menuExportSlices.disabled = false;
            menuFadeIn.disabled = false; menuFadeOut.disabled = false;
            btnPlay.disabled = false; btnStop.disabled = false; 
            btnLoop.disabled = false; btnChopMode.disabled = false;

            status.textContent = `READY: ${file.name.toUpperCase()}`;
            updateUI(); draw(0); updateTimeDisplay(0);
        } catch (err) { status.textContent = "ERR: FILE_CORRUPT"; }
    }

    function encodeWAV(buf) {
        let n = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length * n * 2 + 44;
        let ab = new ArrayBuffer(len), view = new DataView(ab), pos = 0;
        const s = (str) => { for(let i=0; i<str.length; i++) view.setUint8(pos++, str.charCodeAt(i)); };
        s('RIFF'); view.setUint32(pos, len-8, true); pos+=4; s('WAVEfmt '); view.setUint32(pos, 16, true); pos+=4;
        view.setUint16(pos, 1, true); pos+=2; view.setUint16(pos, n, true); pos+=2; view.setUint32(pos, sr, true); pos+=4;
        view.setUint32(pos, sr*n*2, true); pos+=4; view.setUint16(pos, n*2, true); pos+=2; view.setUint16(pos, 16, true); pos+=2;
        s('data'); view.setUint32(pos, len-pos-4, true); pos+=4;
        for(let i=0; i<buf.length; i++) { for(let c=0; c<n; c++) { let v = Math.max(-1, Math.min(1, buf.getChannelData(c)[i])); view.setInt16(pos, v < 0 ? v * 0x8000 : v * 0x7FFF, true); pos+=2; } }
        return ab;
    }

    function exportWav() {
        if (!audioBuf) return;
        const sSmp = Math.floor(loopStart * audioBuf.sampleRate), eSmp = Math.floor(loopEnd * audioBuf.sampleRate);
        const len = eSmp - sSmp;
        if (len <= 0) return;
        const nBuf = audioCtx.createBuffer(audioBuf.numberOfChannels, len, audioBuf.sampleRate);
        for(let c=0; c<audioBuf.numberOfChannels; c++) { nBuf.getChannelData(c).set(audioBuf.getChannelData(c).subarray(sSmp, eSmp)); }
        const wav = encodeWAV(nBuf);
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([wav], {type:'audio/wav'}));
        a.download = `AZ9000_${Date.now()}.wav`; a.click();
    }

    async function exportSlices() {
        if (!audioBuf || sliceMarkers.length === 0) {
            alert("No slice points defined."); return;
        }

        let timestamp = Date.now();
        let folderName = `AZ9000_Slices_${timestamp}/`;
        let sortedSlices = [0, ...sliceMarkers.sort((a,b)=>a-b), audioBuf.duration];
        let sliceBlobs = [];

        for (let i = 0; i < sortedSlices.length - 1; i++) {
            let sSmp = Math.floor(sortedSlices[i] * audioBuf.sampleRate);
            let eSmp = Math.floor(sortedSlices[i+1] * audioBuf.sampleRate);
            let len = eSmp - sSmp;
            if (len <= 0) continue;

            let nBuf = audioCtx.createBuffer(audioBuf.numberOfChannels, len, audioBuf.sampleRate);
            for(let c=0; c<audioBuf.numberOfChannels; c++) {
                nBuf.getChannelData(c).set(audioBuf.getChannelData(c).subarray(sSmp, eSmp));
            }
            let wav = encodeWAV(nBuf);
            sliceBlobs.push({ name: `${folderName}slice_${i+1}.wav`, data: wav });
        }

        let zipParts = [], centralDirectory = [], offset = 0;

        for (let slice of sliceBlobs) {
            let encName = new TextEncoder().encode(slice.name);
            let data = slice.data, crc = 0;

            let header = new Uint8Array(30 + encName.length);
            let view = new DataView(header.buffer);
            view.setUint32(0, 0x04034b50, true); view.setUint16(4, 10, true);
            view.setUint16(6, 0, true); view.setUint16(8, 0, true);
            view.setUint16(10, 0, true); view.setUint16(12, 0, true);
            view.setUint32(14, crc, true); view.setUint32(18, data.byteLength, true);
            view.setUint32(22, data.byteLength, true); view.setUint16(26, encName.length, true);
            view.setUint16(28, 0, true); header.set(encName, 30);
            zipParts.push(header); zipParts.push(data);

            let cdHeader = new Uint8Array(46 + encName.length);
            let cdView = new DataView(cdHeader.buffer);
            cdView.setUint32(0, 0x02014b50, true); cdView.setUint16(4, 20, true);
            cdView.setUint16(6, 10, true); cdView.setUint16(8, 0, true);
            cdView.setUint16(10, 0, true); cdView.setUint16(12, 0, true);
            cdView.setUint16(14, 0, true); cdView.setUint32(16, crc, true);
            cdView.setUint32(20, data.byteLength, true); cdView.setUint32(24, data.byteLength, true);
            cdView.setUint16(28, encName.length, true); cdView.setUint16(30, 0, true);
            cdView.setUint16(32, 0, true); cdView.setUint16(34, 0, true);
            cdView.setUint16(36, 0, true); cdView.setUint32(38, 0, true);
            cdView.setUint32(42, offset, true); cdHeader.set(encName, 46);
            centralDirectory.push(cdHeader);
            offset += header.byteLength + data.byteLength;
        }

        let cdSize = centralDirectory.reduce((acc, part) => acc + part.byteLength, 0);
        let eocd = new Uint8Array(22);
        let eocdView = new DataView(eocd.buffer);
        eocdView.setUint32(0, 0x06054b50, true); eocdView.setUint16(4, 0, true);
        eocdView.setUint16(6, 0, true); eocdView.setUint16(8, sliceBlobs.length, true);
        eocdView.setUint16(10, sliceBlobs.length, true); eocdView.setUint32(12, cdSize, true);
        eocdView.setUint32(16, offset, true); eocdView.setUint16(20, 0, true);

        let finalZip = [...zipParts, ...centralDirectory, eocd];
        let zipBlob = new Blob(finalZip, { type: 'application/zip' });
        
        let a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = `AZ9000_Slices_${timestamp}.zip`;
        a.click();
        status.textContent = "SLICES EXPORTED";
    }

    input.onchange = handleFile;
    window.onload = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; draw(); };
    window.onresize = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; draw(currentPlayTime); };
</script>
</body>
</html>
